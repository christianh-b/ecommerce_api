<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar artículo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Nunito', 'sans-serif'] }
          }
        }
      }
    </script>
</head>
<body class="font-sans bg-[#EDEDED] min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-[#FFE600] sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
      <a th:href="@{/articulos/lista}" class="font-extrabold text-xl text-gray-900">
        Mercado<span class="text-[#3483FA]">Artículos</span>
      </a>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-2xl mx-auto w-full px-4 sm:px-6 py-10">

    <!-- Breadcrumb -->
    <nav class="text-sm text-gray-500 mb-6">
      <a th:href="@{/articulos/lista}" class="text-[#3483FA] hover:underline">Mis artículos</a>
      <span class="mx-2">›</span>
      <span>Editar artículo</span>
    </nav>

    <!-- Card -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <div class="px-8 py-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800">Editar artículo</h1>
        <p class="text-sm text-gray-500 mt-1">Modificá los datos de tu artículo</p>
      </div>

      <form th:action="@{/articulos/editar/{id}(id=${articuloId})}"
            th:object="${articulo}"
            method="post"
            class="px-8 py-6 space-y-6">

        <div>
          <label for="nombre" class="block text-sm font-bold text-gray-700 mb-2">
            Nombre del artículo
          </label>
          <input type="text"
                 th:field="*{nombre}"
                 id="nombre"
                 class="w-full px-4 py-3 border border-gray-300 rounded-sm text-sm focus:outline-none focus:ring-2 focus:ring-[#3483FA] focus:border-transparent transition-all"/>
          <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"
             class="text-red-500 text-xs mt-1"></p>
        </div>

        <div>
          <label for="precio" class="block text-sm font-bold text-gray-700 mb-2">
            Precio
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-semibold text-sm">$</span>
            <input type="number"
                   step="0.01"
                   min="0"
                   th:field="*{precio}"
                   id="precio"
                   class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-sm text-sm focus:outline-none focus:ring-2 focus:ring-[#3483FA] focus:border-transparent transition-all"/>
          </div>
          <p th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"
             class="text-red-500 text-xs mt-1"></p>
        </div>

        <div>
          <label for="imagen" class="block text-sm font-bold text-gray-700 mb-2">
            Imagen <span class="font-normal text-gray-400">(opcional — URL o ruta local)</span>
          </label>
          <input type="text"
                 th:field="*{imagen}"
                 id="imagen"
                 placeholder="https://ejemplo.com/foto.jpg  o  /images/foto.jpg"
                 class="w-full px-4 py-3 border border-gray-300 rounded-sm text-sm focus:outline-none focus:ring-2 focus:ring-[#3483FA] focus:border-transparent transition-all"/>
        </div>

        <div class="flex gap-4 pt-2">
          <a th:href="@{/articulos/lista}"
             class="flex-1 text-center border border-gray-300 text-gray-700 font-bold py-3 rounded-sm hover:bg-gray-50 transition-colors text-sm">
            Cancelar
          </a>
          <button type="submit"
                  class="flex-1 bg-[#3483FA] hover:bg-[#2968c8] text-white font-bold py-3 rounded-sm transition-colors text-sm">
            Guardar cambios
          </button>
        </div>

      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#1a1a1a] text-gray-400 mt-8">
    <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm">
      © 2025 <strong class="text-white">Christian Bordon</strong>. Todos los derechos reservados.
    </div>
  </footer>

</body>
</html>
