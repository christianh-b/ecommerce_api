spring.application.name=proyectoArticulosFinal
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/articulos_db}
spring.datasource.username=${DB_USERNAME:alumno}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT en produccion inyectar JWT_SECRET como variable de entorno
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW5z}
jwt.expiration=86400000

# Swagger UI
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
